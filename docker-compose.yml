version: '3.8'

services:
  mindmap:
    # 使用当前目录的Dockerfile构建镜像
    build: .
    # 端口映射
    ports:
      - "80:3000"    # HTTP服务（前端+API）
      - "3001:3001"  # WebSocket服务（实时协作）
    # 环境变量配置
    environment:
      - NODE_ENV=production
      - DB_FILE=/app/backend/data/mindmap.db
    # 数据卷持久化
    volumes:
      - mindmap-data:/app/backend/data
      - mindmap-uploads:/app/backend/uploads
      - mindmap-thumbnails:/app/backend/thumbnails
    # 自动重启策略
    restart: unless-stopped

# 数据卷定义
volumes:
  mindmap-data:
  mindmap-uploads:
  mindmap-thumbnails:
