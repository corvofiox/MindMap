version: '3.8'

services:
  mindmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindmap-app
    ports:
      - "9000:9000"
    environment:
      # B2(根治,start.js 密钥持久化):从 v1.9.13 起,start.js 会把三个密钥
      # 持久化到数据卷文件 backend/data/.secrets(即下方 ./data 挂载目录),
      # 容器重建后自动恢复,不再随机轮换——无需再通过环境变量注入固定密钥。
      # 此段 environment 注入为可选项,优先级最高(仅更新 .env,不写 .secrets):
      #   - 不配置:start.js 首启生成随机密钥并双写 .secrets/.env,后续重建从
      #     .secrets 恢复(推荐,密钥不出现在 compose 文件/仓库历史中)
      #   - 配置:注入值生效,但 .secrets 不会创建;若之后移除注入,.secrets
      #     为空会一次性轮换三键(所有会话失效一次 + AI 密钥需重配)
      # ⚠️ 如需使用注入,生产环境必须改为强随机值(openssl rand -hex 32)。
      # 修改注入值同样会使会话失效/AI 密钥需重配,请谨慎操作。
    volumes:
      # 持久化数据库数据
      - ./data:/app/backend/data
    restart: unless-stopped
